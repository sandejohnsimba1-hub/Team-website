<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Code Crafters</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">Code Crafters</a>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
      <button class="btn-theme" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main class="container section">
    <h1>Get in Touch</h1>
    <p class="lead">Have a question or want to collaborate? Send a message below.</p>

    <form id="contactForm" class="contact-form">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" required placeholder="John Madimwa">
      </div>
      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" required placeholder="john@example.com">
      </div>
      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" rows="5" required placeholder="Write your message here..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send Message</button>
      <p id="formStatus" class="form-status"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 John Madimwa • Code Crafters</p>
    </div>
  </footer>

  <script src="js/script.js?v=2"></script>
</body>
</html>
